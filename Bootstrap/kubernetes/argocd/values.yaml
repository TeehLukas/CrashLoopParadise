global:
  domain: argocd.k8s.cakiroglu.me

configs:
  params:
    # TLS endet nicht am Argo-CD-Server, der Gateway-Listener spricht HTTP.
    server.insecure: true
  cm:
    url: http://argocd.k8s.cakiroglu.me

server:
  httproute:
    enabled: true
    parentRefs:
      - name: cilium-gateway
        namespace: kube-system
        sectionName: http
    hostnames:
      - argocd.k8s.cakiroglu.me
