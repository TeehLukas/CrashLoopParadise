# Helm-Values für Headlamp unter https://headlamp.k8s.cakiroglu.me
#
# Login über Dex (Client "headlamp"). Headlamp reicht das ID-Token des Benutzers an den
# kube-apiserver weiter, Rechte kommen also aus Kubernetes-RBAC des Benutzers:
# - der API-Server vertraut Dex über KubeAuthenticationConfig
#   (Bootstrap/talos/machine-config/control-plane.yaml.tftpl)
# - Gruppe oidc:admins -> cluster-admin (ArgoCD/Infrastructure/dex/manifests/oidc-cluster-admins.yaml)

config:
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc
      hasScopes: true
    callbackURL: https://headlamp.k8s.cakiroglu.me/oidc-callback

clusterRoleBinding:
  create: false

# Plugins: Im Cluster-Betrieb kann Headlamp nicht über die Web-UI installieren, das kann nur
# die Desktop-App. Der Sidecar lädt die Plugins von Artifact Hub (Pod braucht Internet) und
# installiert bei Änderungen an der Liste nach.
pluginsManager:
  enabled: true
  version: 0.1.1 # @headlamp-k8s/pluginctl
  configContent: |
    plugins:
      - name: headlamp_argocd
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_argocd
        version: 0.1.0-alpha
    installOptions:
      parallel: true
      maxConcurrent: 2

httpRoute:
  enabled: true
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - headlamp.k8s.cakiroglu.me
