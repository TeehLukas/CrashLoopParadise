# Client-Secret des Dex-Clients "argocd" für Argo CD selbst.
# Argo CD löst $argocd-oidc:clientSecret (oidc.config in Bootstrap/kubernetes/argocd/values.yaml)
# nur aus Secrets mit dem Label app.kubernetes.io/part-of=argocd auf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-oidc
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        clientSecret: '{{ .argocdClientSecret | trim }}'
  data:
    - secretKey: argocdClientSecret
      remoteRef:
        key: dex/argocd-client-secret
