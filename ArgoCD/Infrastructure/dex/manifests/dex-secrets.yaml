# Secrets für Dex als Env-Variablen (values.yaml: envFrom dex-secrets).
# Quelle: 1Password-Vault "kubernetes", Item "dex" mit den Feldern
#   htpasswd-lukas         Ausgabe von: htpasswd -nbBC 10 lukas '<passwort>'
#                          (Form "lukas:$2y$10$...", nur bcrypt wird akzeptiert)
#   argocd-client-secret   zufälliger String, z.B. openssl rand -hex 32
#   headlamp-client-secret zufälliger String, z.B. openssl rand -hex 32
#   grafana-client-secret  zufälliger String, z.B. openssl rand -hex 32
#
# Aus der htpasswd-Zeile wird nur der Hash hinter dem ":" übernommen.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-secrets
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: dex-secrets
    template:
      engineVersion: v2
      data:
        DEX_PASSWORD_HASH_LUKAS: '{{ .htpasswdLukas | trim | splitList ":" | last }}'
        DEX_CLIENT_SECRET_ARGOCD: '{{ .argocdClientSecret | trim }}'
        DEX_CLIENT_SECRET_HEADLAMP: '{{ .headlampClientSecret | trim }}'
        DEX_CLIENT_SECRET_GRAFANA: '{{ .grafanaClientSecret | trim }}'
  data:
    - secretKey: htpasswdLukas
      remoteRef:
        key: dex/htpasswd-lukas
    - secretKey: argocdClientSecret
      remoteRef:
        key: dex/argocd-client-secret
    - secretKey: headlampClientSecret
      remoteRef:
        key: dex/headlamp-client-secret
    - secretKey: grafanaClientSecret
      remoteRef:
        key: dex/grafana-client-secret
