# Talos erzwingt standardmäßig Pod Security "baseline". node-exporter braucht hostNetwork,
# hostPID, hostPort und hostPath (/proc, /sys, /), CreateNamespace=true setzt keine Labels.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
