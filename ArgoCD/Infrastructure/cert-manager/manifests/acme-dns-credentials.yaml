# Zugangsdaten der acme-dns-Registrierung für den ClusterIssuer letsencrypt.
# Quelle: 1Password-Vault "kubernetes", Item "acme-dns" mit den Feldern
# username, password, subdomain, fulldomain (Antwort von POST https://auth.acme-dns.io/register).
#
# cert-manager erwartet eine JSON-Map Domain -> Account. Der Eintrag k8s.cakiroglu.me
# gilt auch für *.k8s.cakiroglu.me (gleicher TXT-Record _acme-challenge.k8s.cakiroglu.me).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acme-dns
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: acme-dns
    template:
      engineVersion: v2
      data:
        acmedns.json: |
          {
            "k8s.cakiroglu.me": {
              "username": "{{ .username }}",
              "password": "{{ .password }}",
              "subdomain": "{{ .subdomain }}",
              "fulldomain": "{{ .fulldomain }}",
              "allowfrom": []
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: acme-dns/username
    - secretKey: password
      remoteRef:
        key: acme-dns/password
    - secretKey: subdomain
      remoteRef:
        key: acme-dns/subdomain
    - secretKey: fulldomain
      remoteRef:
        key: acme-dns/fulldomain
