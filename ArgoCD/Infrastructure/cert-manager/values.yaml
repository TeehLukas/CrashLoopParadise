# Helm-Values für cert-manager
crds:
  enabled: true
  keep: true # CRDs (und damit alle Certificates) überleben ein Löschen der App

# DNS-01-Selbstprüfung über öffentliche Resolver, nicht über den Heimnetz-DNS (FritzBox).
dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
dns01RecursiveNameserversOnly: true
