# Synchronisiert die Cluster-Secrets aus ArgoCD/Clusters in den argocd-Namespace.
# Bewusst eine Application und kein ApplicationSet: Ein Cluster-Generator bräuchte
# ein Cluster-Secret, das erst diese App anlegt.
#
# Neuer Cluster = neue Datei in ArgoCD/Clusters (siehe in-cluster.yaml). Was dort landet,
# steuern Labels (<stack>: "true"/"false") und Annotationen (repo, revision, <stack>-path).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clusters
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/TeehLukas/CrashLoopParadise.git
    targetRevision: main
    path: ArgoCD/Clusters
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
