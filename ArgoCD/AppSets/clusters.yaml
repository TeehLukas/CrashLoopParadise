# Eigene App für die Cluster-Verwaltung: synchronisiert die Cluster-Secrets aus
# <clusters-path> in den argocd-Namespace des Management-Clusters.
# Neuer Cluster = eine Secret-Datei in Clusters/ mit
#   Label argocd.argoproj.io/secret-type: cluster, infrastructure: "true"
#   Annotationen repo, revision, infrastructure-path (wie im bootstrap.yaml)
# Der Management-Cluster selbst steht nur im bootstrap.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusters
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            management: "true"
  template:
    metadata:
      name: 'clusters'
    spec:
      project: default
      destination:
        server: '{{ .server }}'
        namespace: argocd
      source:
        repoURL: '{{ .metadata.annotations.repo }}'
        targetRevision: '{{ .metadata.annotations.revision }}'
        path: '{{ index .metadata.annotations "clusters-path" }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
