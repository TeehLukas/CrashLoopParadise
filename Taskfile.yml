version: "3"

# Globale Taskfile. Aufruf aus dem Repo-Root:  task bootstrap
# Eingaben werden per gum abgefragt, sofern nicht als Umgebungsvariable gesetzt
# (z.B. inline: BOOTSTRAP_REPO=... task bootstrap). Benötigt: task, gum, kcl, kubectl.

vars:
  # Dynamische Variablen: `sh` wird beim Task-Start ausgewertet und fragt per gum nach.
  # Vorbelegung aus der Umgebungsvariable bzw. dem Default; mit Enter bestätigen.
  # Ist die Variable gesetzt oder gibt es kein Terminal (/dev/tty), wird nicht gefragt.
  BOOTSTRAP_REPO:
    sh: |
      has_tty() { : </dev/tty; } 2>/dev/null
      if [ -n "${BOOTSTRAP_REPO:-}" ] || ! has_tty; then printf '%s' "${BOOTSTRAP_REPO:-}"
      else gum input </dev/tty --header "Git-Repo-URL" --placeholder "https://github.com/<user>/<repo>.git"; fi
  BOOTSTRAP_REVISION:
    sh: |
      has_tty() { : </dev/tty; } 2>/dev/null
      if [ -n "${BOOTSTRAP_REVISION:-}" ] || ! has_tty; then printf '%s' "${BOOTSTRAP_REVISION:-main}"
      else gum input </dev/tty --header "Revision" --value main; fi
  BOOTSTRAP_INFRASTRUCTURE_PATH:
    sh: |
      has_tty() { : </dev/tty; } 2>/dev/null
      if [ -n "${BOOTSTRAP_INFRASTRUCTURE_PATH:-}" ] || ! has_tty; then printf '%s' "${BOOTSTRAP_INFRASTRUCTURE_PATH:-ArgoCD/Infrastructure}"
      else gum input </dev/tty --header "Infrastructure-Pfad" --value ArgoCD/Infrastructure; fi
  BOOTSTRAP_CLUSTER_NAME:
    sh: |
      has_tty() { : </dev/tty; } 2>/dev/null
      if [ -n "${BOOTSTRAP_CLUSTER_NAME:-}" ] || ! has_tty; then printf '%s' "${BOOTSTRAP_CLUSTER_NAME:-in-cluster}"
      else gum input </dev/tty --header "Cluster-Name" --value in-cluster; fi
  BOOTSTRAP_CLUSTER_SERVER:
    sh: |
      has_tty() { : </dev/tty; } 2>/dev/null
      if [ -n "${BOOTSTRAP_CLUSTER_SERVER:-}" ] || ! has_tty; then printf '%s' "${BOOTSTRAP_CLUSTER_SERVER:-https://kubernetes.default.svc}"
      else gum input </dev/tty --header "Cluster-Server" --value https://kubernetes.default.svc; fi
  # Token: aus OP_SERVICE_ACCOUNT_TOKEN, sonst maskierte Eingabe.
  ONEPASSWORD_TOKEN:
    sh: |
      has_tty() { : </dev/tty; } 2>/dev/null
      if [ -n "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then printf '%s' "$OP_SERVICE_ACCOUNT_TOKEN"
      elif has_tty; then gum input </dev/tty --password --header "1Password Service-Account-Token"; fi

tasks:
  bootstrap:
    desc: Kompletter Bootstrap in fester Reihenfolge (secrets, repo, root)
    cmds:
      - task: bootstrap:secrets
      - task: bootstrap:repo
      - task: bootstrap:root

  bootstrap:secrets:
    desc: 1) Namespace und 1Password-Token für den External-Secrets-ClusterSecretStore
    dir: ArgoCD/bootstrap
    preconditions:
      - sh: '[ -n "{{.ONEPASSWORD_TOKEN}}" ]'
        msg: "1Password-Token fehlt"
    cmds:
      - cmd: kcl run -D part=secrets -D onepassword_token="{{.ONEPASSWORD_TOKEN}}" | kubectl apply -f -
        silent: true # verhindert, dass das Token im Log erscheint

  bootstrap:repo:
    desc: 2) Cluster-Secret mit Repo, Revision und Pfaden
    dir: ArgoCD/bootstrap
    preconditions:
      - sh: '[ -n "{{.BOOTSTRAP_REPO}}" ]'
        msg: "BOOTSTRAP_REPO fehlt"
    cmds:
      - >-
        kcl run -D part=repo
        -D repo="{{.BOOTSTRAP_REPO}}"
        -D revision="{{.BOOTSTRAP_REVISION}}"
        -D infrastructure_path="{{.BOOTSTRAP_INFRASTRUCTURE_PATH}}"
        -D cluster_name="{{.BOOTSTRAP_CLUSTER_NAME}}"
        -D cluster_server="{{.BOOTSTRAP_CLUSTER_SERVER}}"
        | kubectl apply -f -

  bootstrap:root:
    desc: 3) Root-Application, zeigt auf ArgoCD/AppSets
    dir: ArgoCD/bootstrap
    preconditions:
      - sh: '[ -n "{{.BOOTSTRAP_REPO}}" ]'
        msg: "BOOTSTRAP_REPO fehlt"
    cmds:
      - >-
        kcl run -D part=root
        -D repo="{{.BOOTSTRAP_REPO}}"
        -D revision="{{.BOOTSTRAP_REVISION}}"
        -D cluster_server="{{.BOOTSTRAP_CLUSTER_SERVER}}"
        | kubectl apply -f -

  bootstrap:test-render:
    desc: Rendert alles ohne Apply (Token wird nicht ausgegeben, wenn er leer ist -> Dummy)
    dir: ArgoCD/bootstrap
    cmds:
      - >-
        kcl run
        -D repo="{{.BOOTSTRAP_REPO}}"
        -D revision="{{.BOOTSTRAP_REVISION}}"
        -D infrastructure_path="{{.BOOTSTRAP_INFRASTRUCTURE_PATH}}"
        -D cluster_name="{{.BOOTSTRAP_CLUSTER_NAME}}"
        -D cluster_server="{{.BOOTSTRAP_CLUSTER_SERVER}}"
        -D onepassword_token="dummy"
