version: "3"

# Aufruf aus dem Repo-Root nach `terraform apply`:  task bootstrap
# Fragt per gum ab, sofern nicht als Umgebungsvariable gesetzt (OP_SERVICE_ACCOUNT_TOKEN,
# BOOTSTRAP_REPO, BOOTSTRAP_APPSETS_PATH). Benötigt: task, gum, kcl, kubectl, KUBECONFIG.

tasks:
  bootstrap:
    desc: External-Secrets-Token, Repo-Secret und Root-Application anwenden
    dir: ArgoCD/bootstrap
    vars:
      ONEPASSWORD_TOKEN:
        # --char-limit 0: gum kürzt sonst auf 400 Zeichen, SA-Tokens sind deutlich länger
        sh: |
          { [ -n "${OP_SERVICE_ACCOUNT_TOKEN:-}" ] && printf %s "$OP_SERVICE_ACCOUNT_TOKEN" \
            || gum input </dev/tty --password --char-limit 0 --header "1Password Service-Account-Token"; } \
            | tr -d '[:space:]'
      REPO:
        sh: |
          default=$(git remote get-url origin 2>/dev/null | sed -E 's#^git@([^:]+):#https://\1/#')
          [ -n "${BOOTSTRAP_REPO:-}" ] && printf %s "$BOOTSTRAP_REPO" || gum input </dev/tty --header "Git-Repo-URL" --value "$default"
      APPSETS_PATH:
        sh: '[ -n "${BOOTSTRAP_APPSETS_PATH:-}" ] && printf %s "$BOOTSTRAP_APPSETS_PATH" || gum input </dev/tty --header "Pfad der AppSets" --value ArgoCD/AppSets'
    preconditions:
      - sh: '[ -n "{{.ONEPASSWORD_TOKEN}}" ] && [ -n "{{.REPO}}" ] && [ -n "{{.APPSETS_PATH}}" ]'
        msg: "Token, Repo-URL und AppSets-Pfad sind Pflicht"
      # SA-Token = "ops_" + base64(JSON) -> Präfix prüfen und Payload muss als JSON dekodierbar sein
      - sh: |
          t='{{.ONEPASSWORD_TOKEN}}'
          case "$t" in ops_*) ;; *) exit 1 ;; esac
          p="${t#ops_}"
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          printf %s "$p" | tr '_-' '/+' | base64 -d 2>/dev/null | jq -e . >/dev/null 2>&1
        msg: "Token ist kein gültiger 1Password-Service-Account-Token (muss mit ops_ beginnen und vollständig sein – evtl. abgeschnitten?)"
    cmds:
      - cmd: >-
          kcl run
          -D onepassword_token="{{.ONEPASSWORD_TOKEN}}"
          -D repo="{{.REPO}}"
          -D appsets_path="{{.APPSETS_PATH}}"
          | kubectl apply -f -
        silent: true # Token nicht im Log
